<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Concierge</title>
  <script src="config.js"></script>
  <script src="agent.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #fff8f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      color: #fc5c02;
    }

    header p {
      font-size: 0.9rem;
      color: #888;
      margin-top: 4px;
    }

    #chat-container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(252, 92, 2, 0.08);
      display: flex;
      flex-direction: column;
      height: 70vh;
      overflow: hidden;
      border: 1px solid #ffe5d5;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot .avatar {
      width: 32px;
      height: 32px;
      background: #fc5c02;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .message.bot .bubble {
      background: #fff4ee;
      color: #1a1a1a;
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: #fc5c02;
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .restaurant-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ffe5d5;
      border-radius: 12px;
      padding: 12px 16px;
      text-decoration: none;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      background: #fff4ee;
      border-color: #fc5c02;
      transform: translateX(4px);
    }

    .card-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .card-arrow {
      color: #fc5c02;
      font-size: 1.1rem;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      background: #fff4ee;
      border-radius: 16px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #fc5c02;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid #ffe5d5;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ffe5d5;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      background: #fff8f5;
    }

    #user-input:focus {
      border-color: #fc5c02;
    }

    #send-btn {
      background: #fc5c02;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #e05000; }
    #send-btn:disabled { background: #ffb899; cursor: not-allowed; }

    #timeout-banner {
      display: none;
      text-align: center;
      padding: 12px;
      background: #fff4ee;
      color: #fc5c02;
      font-size: 0.85rem;
      border-top: 1px solid #ffe5d5;
    }

    #api-key-screen {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 32px rgba(252, 92, 2, 0.08);
      border: 1px solid #ffe5d5;
      text-align: center;
    }

    #api-key-screen h2 {
      font-family: 'Fraunces', serif;
      color: #fc5c02;
      margin-bottom: 8px;
    }

    #api-key-screen p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #api-key-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ffe5d5;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
    }

    #api-key-input:focus { border-color: #fc5c02; }

    #api-key-btn {
      width: 100%;
      padding: 12px;
      background: #fc5c02;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    #api-key-btn:hover { background: #e05000; }
  </style>
</head>
<body>

  <header>
    <h1>🍽️ Restaurant Concierge</h1>
    <p>Tell me what you're craving — I'll find the best spots near you.</p>
  </header>

  <!-- API Key Screen -->
  <div id="api-key-screen">
    <h2>Welcome</h2>
    <p>Enter your Anthropic API key to get started. It stays in your browser only.</p>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." />
    <button id="api-key-btn">Start Chatting →</button>
  </div>

  <!-- Chat UI (hidden until key is entered) -->
  <div id="chat-container" style="display:none;">
    <div id="messages"></div>
    <div id="timeout-banner">Session ended due to inactivity. Refresh to start again.</div>
    <div id="input-area">
      <input type="text" id="user-input" placeholder="What are you craving today?" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    let apiKey = null;
    let userLocation = null;
    let conversationHistory = [];
    let inactivityTimer = null;

    // --- API Key Setup ---
    document.getElementById('api-key-btn').addEventListener('click', () => {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key.startsWith('sk-ant-')) {
        alert('Please enter a valid Anthropic API key (starts with sk-ant-)');
        return;
      }
      apiKey = key;
      document.getElementById('api-key-screen').style.display = 'none';
      document.getElementById('chat-container').style.display = 'flex';
      initChat();
    });

    // --- Location Fetch ---
    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null)
        );
      });
    }

    // --- Chat Init ---
    async function initChat() {
      userLocation = await getLocation();
      const locationNote = userLocation
        ? "📍 Got your location!"
        : "📍 Couldn't fetch location — I'll ask you for it if needed.";
      addBotMessage(`Hi there! 👋 I'm your Restaurant Concierge. ${locationNote}\n\nWhat are you craving today?`);
      resetInactivityTimer();
    }

    // --- Inactivity Timer ---
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        document.getElementById('user-input').disabled = true;
        document.getElementById('send-btn').disabled = true;
        document.getElementById('timeout-banner').style.display = 'block';
      }, CONFIG.INACTIVITY_TIMEOUT_MS);
    }

    // --- Message Rendering ---
    function addBotMessage(text, restaurants = []) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message bot';
      div.innerHTML = `
        <div class="avatar">🍽️</div>
        <div>
          <div class="bubble">${text.replace(/\n/g, '<br/>')}</div>
          ${restaurants.length ? renderCards(restaurants) : ''}
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addUserMessage(text) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message user';
      div.innerHTML = `<div class="bubble">${text}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderCards(restaurants) {
      if (!restaurants.length) return '';
      return `<div class="restaurant-cards">${restaurants.map(r => `
        <a class="card" href="${r.swiggyUrl}" target="_blank">
          <span class="card-name">${r.name}</span>
          <span class="card-arrow">→</span>
        </a>`).join('')}
      </div>`;
    }

    function showTyping() {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="avatar">🍽️</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    // --- Send Message ---
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addUserMessage(text);
      resetInactivityTimer();

      conversationHistory.push({ role: 'user', content: text });

      document.getElementById('send-btn').disabled = true;
      showTyping();

      try {
        const result = await runAgent(text, userLocation, conversationHistory, apiKey);
        removeTyping();
        addBotMessage(result.message, result.restaurants);
        conversationHistory.push({ role: 'assistant', content: result.message });
      } catch (err) {
        removeTyping();
        addBotMessage(`Sorry, something went wrong: ${err.message}`);
      }

      document.getElementById('send-btn').disabled = false;
      input.focus();
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
